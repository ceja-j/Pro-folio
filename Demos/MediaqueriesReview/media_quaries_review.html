<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Queries</title>
    <style>
        /* Mobile First Design */
        body{background-color: rgb(22, 69, 43);}
        h1{color: white; text-align: center;}
        h2{color: white; text-align: center;}

        /* Media Query for larger screens */
        @media screen and (min-width: 700px) {
            body{background-color: rgb(0, 255, 34);}
            h1{color: rgb(0, 0, 0);}
            h2{color: rgb(0, 0, 0);}
        }

        @media screen and (min-width: 960px) {
            body{background-color: rgb(119, 250, 154);}
            h1{color: rgb(135, 135, 135);}
            h2{color: rgb(139, 138, 138);}
            
        }


        @media screen and (min-width: 1200px) {
        body{background-color: rgb(208, 247, 217);}
        h1{color: rgb(199, 197, 197);}
        h2{color: rgb(206, 204, 204);}
        
    }

    @media  screen and { min-width: 1300px} {
        body{background-color: rgb(255, 255, 255);}
        h1{color: rgb(247, 246, 246);}
        h2{color: rgb(244, 244, 244);}
        
    }


    </style>
</head>
<body>
    <h1>Media Queries</h1>
    <h2> Jonathan Sanchez Ceja</h2>
</body>
</html>
