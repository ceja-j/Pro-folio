<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlexboxJCAT</title>
    <style>
        h1, h2 {text-align: center;}
        #container001 {
            border: 4px solid black;
            background-color: rgb(2, 81, 2);
            margin: auto;
            margin-bottom: 1rem;
            height: 600px;
            width: 600px;
        }
        #container002 {
            height: 600px;
            width: 600px;
            background-color: lightpink;
            border: 4px solid black;
            margin: 0 auto;
        }
        .box{
            height: 50px;
            width: 50px;
            background-color: lightblue;
            border: 1px solid black;
            padding: 1rem;
        }
        /* Justify-Content and Align-Items */
        #container001 {
            display: flex;
            justify-content: column;
            align-items: flex-end;
            flex-direction: column;
        }
        #container002 {
            display: flex;
            flex-direction: row;
            justify-content: flex-end;
            align-items: flex-end;
        }

    </style>
</head>
<body>
    <h1>Flexbox</h1>
    <h2>Flex-Direction</h2>
    <h2>Justify-Content</h2>
    <h2>Align-Items</h2>


    <div>
        <div id="container001">
            <div class="box item001">Item001</div>
            <div class="box item002">Item002</div>
            <div class="box item003">Item003</div>
            <div class="box item004">Item004</div>
            <div class="box item005">Item005</div>
        </div>

        <div id="container002">
            <div class="box item005">Item001</div>
            <div class="box item006">Item002</div>
            <div class="box item007">Item003</div>
            <div class="box item008">Item004</div>
            <div class="box item009">Item005</div>
        </div>
    </div>
</body>
</html>
