<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Header</title>
    <style>
        /* mobile first design */
        body{margin: 0; padding: 0;}
        #pageheader {background-color: rgb(215, 141, 43);}
        #logo {width: 100px; height: 100px; background-color: rgb(131, 129, 129); border-radius: 50%; border: 2px solid darkblue; margin: auto; margin-bottom: 1rem;}
        #pageheader nav {background-color: rgb(46, 77, 104);}
    </style>
</head>
<body>
    <header>
        <div id="logo"></div>
        <nav>
            <ul>
                <li> Home</li>
                <li> About</li>
                <li> Services</li>
                <li> Contact</li>
            </ul>
        </nav>
    </header>
    
</body>
</html>
